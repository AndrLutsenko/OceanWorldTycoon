<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ocean World Tycoon</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#071a46;color:white}header{padding:13px 15px 10px;background:linear-gradient(115deg,#4c18c7,#f528b2);display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px #06132a}h1{font-size:20px;margin:0}#money{font-size:20px;font-weight:900;color:#ffe45e}#rate{font-size:12px;color:#d8fffe}#scene{width:100%;height:46vh;min-height:260px;display:block;touch-action:pan-y}main{background:linear-gradient(#122a73,#091a48);border-radius:18px 18px 0 0;margin-top:-12px;position:relative;padding:12px 12px 80px}h2{font-size:19px;margin:5px 4px 12px}.upgrade{display:flex;align-items:center;gap:10px;padding:11px;margin-bottom:9px;background:linear-gradient(120deg,#5931c5,#9e28b2);border:2px solid #d866f4;border-radius:15px;box-shadow:0 4px 0 #351366}.emoji{font-size:29px;width:40px;text-align:center}.desc{flex:1;min-width:0}.desc strong{font-size:14px}.desc small{display:block;color:#e6d7ff;font-size:11px;margin-top:3px}button{border:0;border-radius:12px;background:linear-gradient(#ffe966,#ffad29);color:#582200;font-weight:900;padding:10px 8px;min-width:93px;box-shadow:0 3px 0 #b96900}button:disabled{filter:grayscale(.8);opacity:.55}#reset{display:block;margin:22px auto;background:#ed3c82;color:white;box-shadow:none;padding:9px 15px}#toast{position:fixed;top:70px;left:15%;right:15%;text-align:center;background:#ffe45e;color:#552568;border-radius:20px;padding:8px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s}footer{text-align:center;color:#9cb4e7;font-size:11px;padding:10px}</style></head><body>
<header><div><h1>🐠 OCEAN WORLD</h1><div id="rate">0 🪙 / сек</div></div><div id="money">🪙 0</div></header><canvas id="scene"></canvas><main><h2>✨ Покращення океану</h2><div id="shop"></div><button id="reset">↻ Скинути прогрес</button><footer>Підводний світ працює автоматично 🫧</footer></main><div id="toast"></div>
<script>
const items=[['🐟','Тропічні рибки','Додає веселих рибок',20,1,1.34],['🪸','Кораловий сад','Корали та новий прибуток',80,4,1.43],['🪼','Медузи','Плавучі сяючі медузи',250,12,1.49],['🐢','Морські черепахи','Повільні добрі мандрівники',700,35,1.52],['⭐','Морські зірки','Прикрашають морське дно',1500,65,1.55],['🐙','Восьминоги','Розумні мешканці глибин',3500,140,1.57],['🦈','Акули','Володарі океану',9000,330,1.59],['💎','Перлинні печери','Відкривають скарби',22000,800,1.61],['🐬','Дельфіни','Стрибають та граються',60000,1900,1.64],['🏝️','Тропічний острів','Нова частина парку',150000,4500,1.67],['👑','Золотий риф','Рідкісні золоті корали',400000,12000,1.7],['🌈','Райдужний океан','Найкраще покращення',1000000,30000,1.75]];
let save;try{save=JSON.parse(localStorage.getItem('oceanSave')||'null')}catch(e){}let state=save&&Array.isArray(save.levels)&&save.levels.length===items.length?save:{coins:25,levels:items.map(()=>0),last:Date.now()};let last=Date.now();const $=id=>document.getElementById(id);function rate(){return state.levels.reduce((a,l,i)=>a+l*items[i][4],0)}function fmt(v){if(v<1000)return Math.floor(v).toLocaleString('uk-UA');let u=['','тис.','млн','млрд','трлн'];let i=Math.min(4,Math.floor(Math.log10(v)/3));return (v/1000**i).toFixed(1)+' '+u[i]}function price(i){return Math.ceil(items[i][3]*items[i][5]**state.levels[i])}function persist(){state.last=Date.now();localStorage.setItem('oceanSave',JSON.stringify(state))}if(save){state.coins+=Math.min(8*3600,Math.max(0,(Date.now()-(state.last||Date.now()))/1000))*rate();persist()}
function render(){ $('money').textContent='🪙 '+fmt(state.coins);$('rate').textContent='+'+fmt(rate())+' 🪙 / сек';$('shop').innerHTML=items.map((it,i)=>`<div class="upgrade"><div class="emoji">${it[0]}</div><div class="desc"><strong>${it[1]} · ${state.levels[i]} рів.</strong><small>${it[2]} · +${fmt(it[4])}/сек</small></div><button data-i="${i}" ${state.coins<price(i)?'disabled':''}>🪙 ${fmt(price(i))}</button></div>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,p=price(i);if(state.coins>=p){state.coins-=p;state.levels[i]++;persist();render();show('✨ Покращення придбано!')}})}function show(s){$('toast').textContent=s;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,1200)}$('reset').onclick=()=>{if(confirm('Повністю обнулити океан і всі монети?')){state={coins:25,levels:items.map(()=>0),last:Date.now()};persist();render()}};
const canvas=$('scene'),ctx=canvas.getContext('2d');let W=400,H=400,t=0;function resize(){let d=Math.min(2,devicePixelRatio||1);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const rand=(a,b)=>a+Math.random()*(b-a);let fish=Array.from({length:70},(_,i)=>({x:Math.random(),y:rand(.16,.79),speed:rand(.015,.07),phase:rand(0,7),size:rand(8,16),color:['#ffdf38','#ff5bc6','#79ff76','#ff7e46','#b8a1ff'][i%5],dir:i%2?1:-1}));let bubbles=Array.from({length:36},()=>({x:Math.random(),y:Math.random(),s:rand(2,7),v:rand(.025,.08)}));function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function draw(){t+=.016;let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#12c7ed');bg.addColorStop(.5,'#0877d3');bg.addColorStop(1,'#34249c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let j=0;j<7;j++){ctx.fillStyle='rgba(190,255,255,.10)';ctx.beginPath();ctx.moveTo(j*W/6-25,0);ctx.lineTo(j*W/6+20,0);ctx.lineTo(j*W/6+105,H);ctx.lineTo(j*W/6+10,H);ctx.fill()}ctx.fillStyle='#e8bb6a';ctx.beginPath();ctx.moveTo(0,H*.88);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H*.88+Math.sin(x*.025+t*.3)*7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(let j=0;j<18;j++){let x=j*W/17,y=H*.89;let c=['#ff4eae','#ffb635','#79ff70','#ac6bff','#ff6855'][j%5];ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-14,y-26,x+Math.sin(t+j)*5,y-42-(j%4)*8);ctx.stroke();ellipse(x,y-30-(j%4)*8,6,9,c)}for(let b of bubbles){let y=(1-((b.y+t*b.v)%1))*H;ctx.strokeStyle='#b7ffffa0';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x*W+Math.sin(t+b.x*10)*8,y,b.s,0,7);ctx.stroke()}let count=Math.min(fish.length,4+state.levels[0]*3+state.levels[1]*2+state.levels[9]*3);for(let i=0;i<count;i++){let f=fish[i],x=((f.x+t*f.speed*f.dir+1000)%1)*W,y=f.y*H+Math.sin(t*1.6+f.phase)*12;ctx.save();ctx.translate(x,y);ctx.scale(f.dir,1);ellipse(0,0,f.size,f.size*.58,f.color);ctx.fillStyle=f.color;ctx.beginPath();ctx.moveTo(-f.size*.65,0);ctx.lineTo(-f.size*1.65,-f.size*.65);ctx.lineTo(-f.size*1.65,f.size*.65);ctx.fill();ellipse(f.size*.45,-f.size*.14,2.4,2.4,'#182052');ctx.restore()}let jelly=Math.min(12,state.levels[2]*2);for(let i=0;i<jelly;i++){let x=W*(.12+i*.17% .8)+Math.sin(t+i)*22,y=H*(.25+(i*.18)% .52)+Math.sin(t*.8+i)*18;ellipse(x,y,16,12,['#ff75e9','#c9a2ff','#7effef'][i%3]);ctx.strokeStyle='#ffcaff';ctx.lineWidth=2;for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(x+k*5,y+7);ctx.quadraticCurveTo(x+k*6+Math.sin(t*3+k)*5,y+20,x+k*5,y+30);ctx.stroke()}}if(state.levels[3]){for(let i=0;i<Math.min(5,state.levels[3]);i++){let x=W*(.2+i*.16)+Math.sin(t*.5+i)*40,y=H*(.5+i*.07)+Math.cos(t*.6+i)*20;ellipse(x,y,19,12,'#58e98d');ellipse(x+15,y-1,8,8,'#9bff6c');for(let d of [-1,1])ellipse(x-4,y+d*12,9,5,'#2bba9e')}}if(state.levels[5]){for(let i=0;i<Math.min(4,state.levels[5]);i++){let x=W*(.3+i*.2)+Math.sin(t*.8+i)*24,y=H*.72+Math.sin(t+i)*12;ellipse(x,y,14,13,'#e869f4');for(let a=0;a<6;a++)ellipse(x+Math.cos(a)*14,y+Math.sin(a)*12,5,9,'#b94cde')}}if(state.levels[6]){for(let i=0;i<Math.min(4,state.levels[6]);i++){let x=((t*.02+i*.27)%1)*W,y=H*(.22+i*.1);ellipse(x,y,32,10,'#b0c6e5');ctx.fillStyle='#b0c6e5';ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x-28,y-18);ctx.lineTo(x-8,y-9);ctx.fill()}}if(state.levels[10]){ctx.fillStyle='#ffe45a';for(let i=0;i<12;i++)ellipse((i*.137%1)*W,H*.86-((i*17)%32),3,5,'#ffe45a')}requestAnimationFrame(draw)}render();draw();setInterval(()=>{let now=Date.now(),dt=Math.min(2,(now-last)/1000);last=now;state.coins+=rate()*dt;render()},500);setInterval(persist,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
</script></body></html>
